defaults:
  - config        # inherits base config
  - _self_

dataset: [constant_jitterx5b5]
action_latency: null
qvar: [1.5]
loc_algo: slice_linear
diff_max: [0.8]
diff_min: [0.2]

# 100 updates total: num_updates = num_env_steps // num_steps // num_processes
num_env_steps: 100000
# num_env_steps: 10000000
cuda_deterministic: true
birthx: 0.1
rotate_by: 1

experiment_name: PE_test
path:
  curriculum_name: 081626_const_jitter

log_interval: 1

r_shaping: [step,missed_time_cost,rotate_by,birthx_cl_last,cosine]

seed: 12685
num_processes: 2
# 1000 env steps of data per update (num_steps * num_processes)
num_steps: 500
num_mini_batch: 2
ppo_epoch: 5
lr: 3e-4

outsuffix: debugger_test_hydra
birthx_linear_tc_steps: 7
dryrun: false

env_version: v3
# Observation channels: 0 wind_x, 1 wind_y, 2 odor, 3 head_x, 4 head_y, 5 course_x, 6 course_y
# obs_mask lists indices to zero out; obs shape is unchanged.
obs_mask: []
if_train_actor_std: false
if_vec_norm: 1
wandb: 0
